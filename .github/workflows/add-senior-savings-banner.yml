name: Add senior savings banner

on:
  push:
    branches: [main]
    paths: [.github/workflows/add-senior-savings-banner.yml]

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bold senior offer above every PA landing page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/ServiceLandingPage.tsx')
          s=p.read_text()
          old='''  return (\n    <header className="sticky top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur">'''
          new='''  return (\n    <>\n      <div className="bg-amber-300 px-4 py-3 text-center text-sm font-black text-amber-950 sm:text-base">SENIORS SAVE 10% — or take $250 off, whichever saves more. New installations only · Book by Oct. 31 · Cannot combine.</div>\n      <header className="sticky top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur">'''
          end='''    </header>\n  );\n}'''
          endnew='''      </header>\n    </>\n  );\n}'''
          if 'SENIORS SAVE 10%' not in s:
            if old not in s or end not in s: raise SystemExit('Header target not found')
            s=s.replace(old,new,1).replace(end,endnew,1)
          p.write_text(s)
          PY
      - name: Save senior offer banner
        run: |
          git config user.name "CleanGutters ad landing pages"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/ServiceLandingPage.tsx
          git commit -m "Show senior installation savings on PA landing pages"
          git push

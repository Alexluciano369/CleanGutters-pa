name: Install website call tracking
on: workflow_dispatch
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Google website-call number replacement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          if 'OnzICJfTuoAdEIPygM1D' not in text:
              anchor = "gtag('config', 'G-E7NG44429T');"
              if anchor not in text:
                  raise SystemExit('Tracking anchor not found')
              config = "gtag('config', 'AW-18146670851/OnzICJfTuoAdEIPygM1D', { 'phone_conversion_number': '(856) 874-6640' });"
              p.write_text(text.replace(anchor, anchor + "\n      " + config, 1))
          PY
      - name: Commit tracking
        run: |
          git config user.name "Ryze Tracking"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Track completed website calls after 30 seconds"
          git push
